<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Меним сайтым - Зайнулла Жангирхан</title>
    <style>
        body {
            font-family: Arial;
            background: #00BFFF;
            padding: 20px;
        }

        .box {
            background: #ffffff;
            color: #000;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        button {
            padding: 5px 10px;
            cursor: pointer;
        }

        textarea {
            width: 100%;
            height: 60px;
        }

        input {
            width: 100%;
            padding: 5px;
        }
    </style>
</head>
<body>

   <h1>Меним Сайтым</h1> 
   <h1>Зайнулла Жангирхан</h1> 

   <div class="box">
        <h2>Киру саны</h2>
        <p>Сайтты ашты: <span id="counter">0</span> рет</p>
   </div>

   <div class="box">
        <h2>Сообщение калдыру</h2>
        <h3>сайтты тагы не косуга болады\/</h3>

                <input id="name" placeholder="Атынды жаз ыы">
        <br><br>

        <textarea id="message" placeholder="Сообщение жаз..."></textarea>
        <br><br>
        <button onclick="addMessage()">Жберу</button>

        <h3>Сообщения:</h3>
        <ul id="messages"></ul>
   </div>

   <script>
               let visits = localStorage.getItem("visits");

        if (visits === null) {
            visits = 1;
        } else {
            visits = Number(visits) + 1;
        }

        localStorage.setItem("visits", visits);
        document.getElementById("counter").textContent = visits;

               let messages = JSON.parse(localStorage.getItem("messages")) || [];

        function showMessages() {
            let list = document.getElementById("messages");
            list.innerHTML = "";

            for (let msg of messages) {
                let li = document.createElement("li");
                li.textContent = msg;
                list.appendChild(li);
            }
        }

                function addMessage() {
            let name = document.getElementById("name").value;
            let text = document.getElementById("message").value;

            if (name !== "" && text !== "") {
                messages.push(name + ": " + text);
                localStorage.setItem("messages", JSON.stringify(messages));
                document.getElementById("message").value = "";
                showMessages();
            }
        }

        showMessages();
   </script>

   <h3>сайт 23 кантар 26шы жылы курылды</h3>

</body>
</html>
