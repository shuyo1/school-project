<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Меним сайтым - Зайнулла Жангирхан</title>
    <style>
        body {
            font-family: Arial;
            background: #00BFFF;
            padding: 20px;
        }
        .box {
            background: #ffffff;
            color: #000;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        button {
            padding: 5px 10px;
            cursor: pointer;
        }
        textarea {
            width: 100%;
            height: 60px;
        }
        input {
            width: 100%;
            padding: 5px;
        }
    </style>
</head>
<body>

<h1>Меним Сайтым</h1> 
<h1>Зайнулла Жангирхан</h1> 

<div class="box">
    <h2>Киру саны</h2>
    <p>Сайтты ашты: <span id="counter">—</span> рет</p>
</div>

<div class="box">
    <h2>Сообщение калдыру</h2>
    <h3>сайтты тагы не косуга болады?\/</h3>

    <input id="name" placeholder="Атынды жаз">
    <br><br>

    <textarea id="message" placeholder="Сообщение жаз..."></textarea>
    <br><br>

    <button onclick="addMessage()">Жиберу</button>

    <h3>Сообщения:</h3>
    <ul id="messages"></ul>
</div>

<h3>сайт 23 кантар 26шы жылы курылды</h3>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCZDL81nWGKDB1vtnB7zuwfzFX6iL-qPUk",
    authDomain: "schoolproject-77573.firebaseapp.com",
    projectId: "schoolproject-77573",
    storageBucket: "schoolproject-77573.firebasestorage.app",
    messagingSenderId: "845334736978",
    appId: "1:845334736978:web:b1d0d98855efaab88caf8b"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const messagesRef = collection(db, "messages");

  const list = document.getElementById("messages");

   onSnapshot(messagesRef, (snapshot) => {
    list.innerHTML = "";
    snapshot.forEach((doc) => {
      const data = doc.data();
      const li = document.createElement("li");
      li.textContent = data.name + ": " + data.text;
      list.appendChild(li);
    });
  });

   window.addMessage = async function () {
    const name = document.getElementById("name").value;
    const text = document.getElementById("message").value;

    if (name && text) {
      await addDoc(messagesRef, { name, text });
      document.getElementById("message").value = "";
    }
  };

    let visits = localStorage.getItem("visits");
  visits = visits ? Number(visits) + 1 : 1;
  localStorage.setItem("visits", visits);
  document.getElementById("counter").textContent = visits;
</script>

</body>
</html>
